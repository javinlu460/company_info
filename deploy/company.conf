# 主站 - 前台官网
server {
    listen 80 default_server;
    server_name sdyaoshun.cn www.sdyaoshun.cn;

    # 前台官网
    location / {
        root /www/company-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件访问
    location /uploads/ {
        alias /data/company_info/uploads/;
    }
}
# 服务器配置路径下  /www/server/panel/vhost/rewrite
# 后台管理子域名
server {
    listen 80;
    server_name admin.sdyaoshun.cn;

    location / {
        root /www/company-cms/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API 代理（后台也走同一个 API）
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}