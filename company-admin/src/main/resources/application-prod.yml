server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${PROD_DB_HOST:localhost}:${PROD_DB_PORT:3306}/${PROD_DB_NAME:company_info}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${PROD_DB_USERNAME:company_info}
    password: ${PROD_DB_PASSWORD:nw7hreAkrTaMC6Wn}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭控制台 SQL 打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

jwt:
  secret: ${JWT_SECRET:companyInfoSecretKey2024VeryLongSecretKeyForJWT}
  expiration: 86400000

# 文件上传路径（生产环境建议配置为绝对路径）
file:
  upload-path: ${PROD_UPLOAD_PATH:/data/company_info/uploads/}
